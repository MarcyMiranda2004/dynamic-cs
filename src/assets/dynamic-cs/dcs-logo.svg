<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="DCS">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@600&display=swap');
    text { font-family: Roboto, sans-serif; }
  </style>

  <!-- Orbite concentriche: anelli fissi -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#991439" stroke-width="2"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#991439" stroke-width="2"/>

  <!-- Pallini sull'anello interno, senso orario -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="14s" repeatCount="indefinite"/>
    <circle cx="100" cy="28" r="6.5" fill="#991439"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 100 100" to="480 100 100" dur="14s" repeatCount="indefinite"/>
    <circle cx="100" cy="28" r="6.5" fill="#991439"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 100 100" to="600 100 100" dur="14s" repeatCount="indefinite"/>
    <circle cx="100" cy="28" r="6.5" fill="#991439"/>
  </g>

  <!-- Pallini sull'anello esterno, senso antiorario, sfalsati di 60° rispetto all'interno -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="420 100 100" to="60 100 100" dur="20s" repeatCount="indefinite"/>
    <circle cx="100" cy="8" r="5.5" fill="#991439"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="540 100 100" to="180 100 100" dur="20s" repeatCount="indefinite"/>
    <circle cx="100" cy="8" r="5.5" fill="#991439"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="660 100 100" to="300 100 100" dur="20s" repeatCount="indefinite"/>
    <circle cx="100" cy="8" r="5.5" fill="#991439"/>
  </g>

  <!-- Lettere -->
  <text x="100" y="100" dy="0.35em" text-anchor="middle"
        font-size="44" font-weight="600" letter-spacing="3" fill="#991439">DCS</text>

  <!-- Se l'utente ha attivato "riduci movimento", le animazioni si fermano -->
  <script><![CDATA[
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.pauseAnimations();
    }
  ]]></script>
</svg>
